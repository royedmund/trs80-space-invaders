<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">TRS-80 Model III minimal MIDI OUT interface</title>
<desc id="desc">DB25 pin 2 to MAX3232 R1IN, R1OUT to Nano D10, Nano D1 through 220 ohms to DIN pin 5, 5 V through 220 ohms to pin 4, common ground to pin 2 and DB25 pin 7.</desc>
<rect width="1200" height="610" fill="white"/>
<g font-family="Arial, Helvetica, sans-serif" fill="#17212d">
<text x="600" y="44" font-size="29" text-anchor="middle" font-weight="bold">TRS-80 Model III / MIDI OUT — minimal interface</text>
<text x="600" y="72" font-size="17" text-anchor="middle">One-way serial bridge · 9600 → 31,250 baud · Rev 0.1</text>
<g fill="#f6f8fa" stroke="#25364a" stroke-width="2">
<rect x="30" y="104" width="150" height="65" rx="4"/>
<rect x="30" y="233" width="195" height="227" rx="4"/>
<rect x="290" y="205" width="220" height="255" rx="4"/>
<rect x="575" y="205" width="230" height="255" rx="4"/>
<rect x="990" y="233" width="180" height="227" rx="4"/>
</g>
<g font-weight="bold" font-size="18" text-anchor="middle">
<text x="105" y="130">Regulated +5 V</text>
<text x="127" y="259">TRS-80 Model III</text>
<text x="400" y="258">MAX3232 module</text>
<text x="690" y="258">Arduino Nano</text>
<text x="1080" y="259">MIDI OUT</text>
</g>
<g font-size="15" text-anchor="middle">
<text x="105" y="151">USB or 5V input*</text>
<text x="127" y="282">DB-25 · RS-232</text>
<text x="127" y="302">9600 baud / 8N1</text>
<text x="400" y="280">RS-232 → 5 V logic</text>
<text x="400" y="380">Onboard charge-pump</text>
<text x="400" y="399">capacitors</text>
<text x="690" y="280">ATmega328P · 5 V / 16 MHz</text>
<text x="1080" y="282">5-pin DIN · 180°</text>
<text x="1080" y="400">Pins 1 and 3: NC</text>
<text x="1080" y="421">To EMT-10 MIDI IN</text>
</g>
<g stroke="#25364a" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
<!-- supply rail -->
<path d="M180 136 H905 M400 136 V205 M690 136 V205"/>
<!-- R1 and DIN pin 4 -->
<path d="M905 136 V180 l-8 8 16 10 -16 10 16 10 -16 10 8 8 V312 H990"/>
<!-- RS232 and logic signal wires -->
<path d="M225 340 H290 M510 340 H575 M805 340 H843 l8 -8 10 16 10 -16 10 16 10 -16 8 8 H990"/>
<!-- ground rail -->
<path d="M105 169 V188 H15 V493 H1080 M127 460 V493 M400 460 V493 M690 460 V493 M1080 460 V493 M60 493 V505 M46 505 H74 M51 511 H69 M56 517 H64"/>
</g>
<g fill="#25364a">
<circle cx="400" cy="136" r="4"/><circle cx="690" cy="136" r="4"/>
<circle cx="127" cy="493" r="4"/><circle cx="400" cy="493" r="4"/><circle cx="690" cy="493" r="4"/><circle cx="60" cy="493" r="4"/>
</g>
<g font-size="15">
<text x="190" y="125">+5 V rail</text>
<text x="400" y="227" text-anchor="middle">VCC</text>
<text x="690" y="227" text-anchor="middle">5V</text>
<text x="930" y="198" font-weight="bold">R1</text>
<text x="930" y="219">220 Ω</text>
<text x="875" y="315" text-anchor="middle" font-weight="bold">R2</text>
<text x="875" y="365" text-anchor="middle">220 Ω</text>
<text x="212" y="333" text-anchor="end">Pin 2 · TXD</text>
<text x="303" y="333">R1IN</text>
<text x="497" y="333" text-anchor="end">R1OUT</text>
<text x="588" y="333">D10 / RX</text>
<text x="792" y="333" text-anchor="end">D1 / TX</text>
<text x="588" y="357">9600 baud</text>
<text x="792" y="357" text-anchor="end">31,250 baud</text>
<text x="1003" y="307">Pin 4</text>
<text x="1003" y="335">Pin 5</text>
<text x="127" y="445" text-anchor="middle">Pin 7 · GND</text>
<text x="400" y="445" text-anchor="middle">GND</text>
<text x="690" y="445" text-anchor="middle">GND</text>
<text x="1080" y="445" text-anchor="middle">Pin 2 · shield</text>
<text x="85" y="518">Common GND</text>
</g>
<g font-size="14" fill="#445165">
<text x="30" y="552">* One power source only; do not apply 5 V to VIN. Ground and supply wires shown at module level.</text>
<text x="30" y="574">Disable flow control; send raw binary bytes. Verify socket numbering and MAX3232 signal direction.</text>
<text x="30" y="596">Prototype: direct Nano TX driver; not hardware tested or MIDI compliance certified. Disconnect MIDI while uploading firmware.</text>
</g>
</g></svg>